server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         www.tiwenlab.com;
    root                /var/www/tiwenlab.com/public;

    # SSL
    ssl_certificate     /etc/nginx/ssl/tiwenlab.com.crt;
    ssl_certificate_key /etc/nginx/ssl/tiwenlab.com.key;

    # security
    include             nginxconfig.io/security.conf;

    # logging
    access_log          /var/log/nginx/access.log combined buffer=512k flush=1m;
    error_log           /var/log/nginx/error.log warn;

    # index.html fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.php fallback
    location ~ ^/api/ {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # reverse proxy
    location /api {
        proxy_pass            http://127.0.0.1:8080;
        proxy_set_header Host $host;
        include               nginxconfig.io/proxy.conf;
    }

    # additional config
    include nginxconfig.io/general.conf;
}

# non-www, subdomains redirect
server {
    listen              443 ssl http2;
    listen              [::]:443 ssl http2;
    server_name         .tiwenlab.com;

    # SSL
    ssl_certificate     /etc/nginx/ssl/tiwenlab.com.crt;
    ssl_certificate_key /etc/nginx/ssl/tiwenlab.com.key;

    # logging
    error_log           /var/log/nginx/error.log warn;
    return              301 https://www.tiwenlab.com$request_uri;
}

# HTTP redirect
server {
    listen      80;
    listen      [::]:80;
    server_name .tiwenlab.com;

    # logging
    error_log   /var/log/nginx/error.log warn;
    return      301 https://www.tiwenlab.com$request_uri;
}