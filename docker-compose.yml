# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker compose build
#    Start all: docker compose up -d
# Start app only: docker compose up -d app nginx
#    Start db: docker compose up -d db
# Run migrations: docker compose run migrate
#    Stop all: docker compose down (add -v to wipe db)
#
version: "3.7"

# 定义持久化存储卷
volumes:
  db_data: # PostgreSQL数据持久化存储，即使容器删除数据也不会丢失

# 定义共享环境变量，用于服务间共享配置
# 在 docker-compose.yaml 文件所在的同一目录下创建一个 .env 文件。Docker Compose 会自动读取这个文件中的环境变量。
x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug} # 日志级别，未设置时默认为debug
  DATABASE_HOST: db # 数据库主机名，使用服务名称
  DATABASE_NAME: ${VAPOR_DATABASE_NAME}
  DATABASE_USERNAME: ${VAPOR_DATABASE_USERNAME}
  DATABASE_PASSWORD: ${VAPOR_DATABASE_PASSWORD}

services:
  # Vapor应用服务
  app:
    image: quest:latest # 容器镜像名称
    build:
      context: . # 使用当前目录作为构建上下文
    environment:
      <<: *shared_environment # 引用共享环境变量
    depends_on:
      - db # 确保数据库服务先启动
    command:
      [
        "serve",
        "--env",
        "production",
        "--hostname",
        "0.0.0.0",
        "--port",
        "8080",
      ]
    networks:
      - app-network # 连接到应用网络
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # Nginx反向代理服务
  nginx:
    image: nginx:alpine # 使用官方nginx镜像的alpine版本
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Docs/nginxconfig.io-tiwenlab.com/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./Docs/nginxconfig.io-tiwenlab.com/conf.d:/etc/nginx/conf.d:ro
      - ${SSL_CERT_DIR:-./Docs/ssl}:/etc/nginx/ssl:ro # 提供默认值
      - ./Public:/var/www/tiwenlab.com/public:ro
    depends_on:
      app:
        condition: service_healthy # 添加健康检查依赖
    networks:
      - app-network
    restart: unless-stopped # 添加重启策略
    healthcheck: # 添加健康检查
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  # 数据库迁移服务
  migrate:
    image: quest:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--yes"] # 执行数据库迁移
    deploy:
      replicas: 0 # 默认不部署，仅在需要时手动运行
    networks:
      - app-network

  # 数据库回滚服务
  revert:
    image: quest:latest
    build:
      context: .
    environment:
      <<: *shared_environment
    depends_on:
      - db
    command: ["migrate", "--revert", "--yes"] # 回滚上一次迁移
    deploy:
      replicas: 0 # 默认不部署，仅在需要时手动运行
    networks:
      - app-network

  # PostgreSQL数据库服务
  db:
    image: postgres:16-alpine # 使用轻量级Alpine版本
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata # 数据持久化
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata # 数据目录
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432" # 数据库端口映射，仅用于开发环境
    networks:
      - app-network

# 定义网络配置
networks:
  app-network:
    driver: bridge # 使用bridge络驱动，适用于单机部署
