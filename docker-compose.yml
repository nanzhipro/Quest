# Docker Compose file for Vapor
#
# Install Docker on your system to run and test
# your Vapor app in a production-like environment.
#
# Note: This file is intended for testing and does not
# implement best practices for a production deployment.
#
# Learn more: https://docs.docker.com/compose/reference/
#
#   Build images: docker compose build
#    Start all: docker compose up -d
# Start app only: docker compose up -d app
#    Start db: docker compose up -d db
# Run migrations: docker compose run migrate
#    Stop all: docker compose down (add -v to wipe db)
#

# 定义持久化存储卷
volumes:
  db_data: # PostgreSQL数据持久化存储，即使容器删除数据也不会丢失

# 定义共享环境变量，用于服务间共享配置
# 在 docker-compose.yaml 文件所在的同一目录下创建一个 .env 文件。Docker Compose 会自动读取这个文件中的环境变量。
x-shared_environment: &shared_environment
  LOG_LEVEL: ${LOG_LEVEL:-debug} # 日志级别，未设置时默认为debug
  DATABASE_HOST: db # 数据库主机名，使用服务名称
  DATABASE_NAME: ${VAPOR_DATABASE_NAME}
  DATABASE_USERNAME: ${VAPOR_DATABASE_USERNAME}
  DATABASE_PASSWORD: ${VAPOR_DATABASE_PASSWORD}
  # 添加 TLS 相关环境变量
  TLS_CERT_PATH: ${TLS_CERT_PATH:-/app/certs/cert.pem}
  TLS_KEY_PATH: ${TLS_KEY_PATH:-/app/certs/key.pem}

services:
  # Vapor应用服务
  app:
    image: quest:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BUILDKIT_INLINE_CACHE: 1
    environment:
      <<: *shared_environment
    ports:
      - "443:443"
    volumes:
      - ./Docs/ssl:/app/certs:ro
      - ./.env:/app/.env:rw
      - ./Resources/Prompts:/app/Resources/Prompts:rw
    depends_on:
      db:
        condition: service_healthy
    command:
      ["serve", "--env", "production", "--hostname", "0.0.0.0", "--port", "443"]
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      # 使用 wget 替代 curl，因为 Alpine 基础镜像默认包含 wget
      test:
        [
          "CMD",
          "wget",
          "--no-check-certificate",
          "-q",
          "-O",
          "-",
          "https://0.0.0.0:443/health",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
      - /var/run
    env_file:
      - .env
    user: "root:root" # 临时使用 root 用户启动

  # 数据库迁移服务
  migrate:
    image: quest:latest
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--yes"] # 执行数据库迁移
    deploy:
      replicas: 0 # 默认不部署，仅在需要时手动运行
    networks:
      - app-network

  # 数据库回滚服务
  revert:
    image: quest:latest
    environment:
      <<: *shared_environment
    depends_on:
      db:
        condition: service_healthy
    command: ["migrate", "--revert", "--yes"] # 回滚上一次迁移
    deploy:
      replicas: 0 # 默认不部署，仅在需要时手动运行
    networks:
      - app-network

  # PostgreSQL数据库服务
  db:
    image: postgres:16-alpine
    volumes:
      - db_data:/var/lib/postgresql/data/pgdata
    environment:
      PGDATA: /var/lib/postgresql/data/pgdata
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    networks:
      - app-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 1G

# 定义网络配置
networks:
  app-network:
    driver: bridge # 使用bridge络驱动，适用于单机部署
